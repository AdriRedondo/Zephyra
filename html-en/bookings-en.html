<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Reservations</title>

    <script src="../js/formulario.js" type="text/javascript"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <a href="../html-es/reservas.html" lang="en" title="Change to Spanish">
            Español (ES)
        </a>
        <div class="div-logo">
            <img src="../images/icono-logo.png" alt="Zephyra Logo" title="Zephyra Logo" width="150">
            <h1 class="zephyra">ZEPHYRA</h1>
        </div>
        <nav class="barra-menu">
            <a class="elem-menu" href="index-en.html" accesskey="h">Home</a>
            <a class="elem-menu" href="vehicles-en.html" accesskey="v">Vehicles</a>
            <a class="elem-menu" href="bookings-en.html" accesskey="b">Bookings</a>
            <a class="elem-menu" href="contact-en.html" accesskey="c">Contact</a>
        </nav>
    </header>
    <main>
        <section id="Reservas">
            <h2>Bookings</h2>
            <form id="reservas-form" aria-label="Booking form">
                <fieldset>
                    <legend>Booking details</legend>
                    <label for="nombre">Name: </label>
                    <input type="text" id="nombre" required><br><br>

                    <label for="correo">Email address: </label>
                    <input type="email" id="correo" required><br><br>

                    <label for="vehiculos-form">Vehicles: </label>
                    <select id="vehiculos-form" required>
                        <option value="tesla">Tesla</option>
                        <option value="toyota">Toyota</option>
                        <option value="audi">Audi</option>
                    </select>
                    <br><br>

                    <label for="inicio">Start: </label>
                    <input type="datetime-local" id="inicio" required><br><br>

                    <label for="fin">End: </label>
                    <input type="datetime-local" id="fin" required><br><br>

                    <label for="telefono">Phone: </label>
                    <input type="tel" id="telefono" pattern="[0-9]{9}"><br><br>

                    <label for="terminos">Accept terms and conditions</label>
                    <input type="checkbox" id="terminos" required><br><br>

                    <button type="submit" aria-label="Submit form">Send</button>
                    <button type="reset" aria-label="Clear form">Clear</button>
                </fieldset>

            </form>
        </section>
    </main>
    <footer>
        <p>&copy; COPYRIGHT 2025 Zephyra</p>
    </footer>
</body>

</html>
