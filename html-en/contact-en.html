<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Contact Form</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <a href="../html-es/contacto.html" lang="es" title="Change to Spanish">
            Español (ES)
        </a>
        <div class="div-logo">
            <img src="../images/icono-logo.png" alt="Zephyra Logo" title="Zephyra Logo" width="150">
            <h1 class="zephyra">ZEPHYRA</h1>
        </div>
        <nav class="barra-menu">
            <a class="elem-menu" href="index-en.html" accesskey="h">Home</a>
            <a class="elem-menu" href="vehicles-en.html" accesskey="v">Vehicles</a>
            <a class="elem-menu" href="bookings-en.html" accesskey="b">Bookings</a>
            <a class="elem-menu" href="contact-en.html" accesskey="c">Contact</a>
        </nav>
    </header>
    <main>
        <form>
            <h2>Contacto</h2>

            <fieldset>
                <legend>Datos de contacto</legend>

                <label for="nombre">Name</label>
                <input type="text" id="nombre"><br><br>
                <label for="email">Email</label>
                <input type="text" id="email"><br><br>
                <label for="mensaje">Message</label>
                <input type="text" id="mensaje"><br><br>
                <button type="submit">Send</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; COPYRIGHT 2025 Zephyra</p>
    </footer>
</body>

</html>
