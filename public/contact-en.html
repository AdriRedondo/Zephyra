<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Contact Form</title>

    <link rel="stylesheet" href="./styles/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/form-contact.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <button class="navbar-toggler ms-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <a class="navbar-brand div-logo" href="./index-en.html">
                    <img src="./images/icono-logo.png" alt="Logo Zephyra" title="Logo Zephyra" width="100">
                    <h1 class="zephyra">ZEPHYRA</h1>
                </a>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ">
                        <li class="nav-item me-2"><a class="nav-link elem-menu p-2" href="index-en.html"
                                accesskey="h">Home</a>
                        </li>
                        <li class="nav-item me-2"><a class="nav-link elem-menu p-2" href="vehicles-en.html"
                                accesskey="v">vehicles</a>
                        </li>
                        <li class="nav-item me-2"><a class="nav-link elem-menu p-2" href="bookings-en.html"
                                accesskey="b">Bookings</a>
                        </li>
                        <li class="nav-item me-2"><a class="nav-link elem-menu p-2" href="contact-en.html"
                                accesskey="c">Contact</a>
                        </li>
                        <li class="nav-item me-2"><a class="nav-link elem-menu p-2" href="register-en.html"
                                accesskey="r">Register</a>
                        </li>
                        <li class="nav-item dropdown me-2">
                            <a class="dropdown-toggle nav-link elem-menu" href="#" role="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                Change language
                            </a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a href="./index.html" lang="es" title="Cambiar a Inglés" class="dropdown-item">
                                        Spanish (SP)
                                    </a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section id="Contacto" class="contacto">
            <h2>Contact</h2>
            <form id="contacto-form-id" class="contacto-form" aria-label="Contact form" method="post"
                action="/submit_contact">
                <div class="mb-3">
                    <fieldset class="contact-fs">
                        <input type="hidden" name="idioma" value="english">
                        <legend>Contact Details</legend>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Name:
                            </label>
                            <input type="text" id="nombre" name="nombre" class="form-control"
                                placeholder="Ex: Eustaquio Ramirez">
                            <span id="nombre-error" class="error" aria-live="polite"></span>
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label">Email:
                            </label>
                            <input type="email" id="correo" name="correo" class="form-control"
                                placeholder="Ex: eusta03@ucm.es">
                            <span id="correo-error" class="error" aria-live="polite"></span>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Message:
                            </label>
                            <input type="text" id="mensaje" name="mensaje" class="form-control"
                                placeholder="Ex: Patata">
                            <span id="mensaje-error" class="error" aria-live="polite"></span>
                        </div>

                        <button type="submit" class="btn btn-success" aria-label="Send form">Send</button>
                        <button type="reset" class="btn btn-secondary" aria-label="Clear form">Clear</button>
                    </fieldset>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; COPYRIGHT 2025 Zephyra</p>
    </footer>
    <script src="./script/formulario-contacto.js" type="text/javascript"></script>
    <script src="./script/bootstrap.bundle.min.js" type="text/javascript"></script>
</body>

</html>
