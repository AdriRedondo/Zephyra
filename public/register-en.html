<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Contact Form</title>

    <link rel="stylesheet" href="./styles/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/form-registro.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <button class="navbar-toggler ms-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand div-logo" href="./index.html">
                <img src="./images/icono-logo.png" alt="Logo Zephyra" title="Logo Zephyra" width="100">
                <h1 class="zephyra">ZEPHYRA</h1>
            </a>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ">
                    <li class="nav-item me-2"><a class="nav-link elem-menu p-2" href="index.html"
                            accesskey="i">Inicio</a>
                    </li>
                    <li class="nav-item me-2"><a class="nav-link elem-menu p-2" href="vehiculos.html"
                            accesskey="v">Vehículos</a>
                    </li>
                    <li class="nav-item me-2"><a class="nav-link elem-menu p-2" href="reservas.html"
                            accesskey="r">Reservas</a>
                    </li>
                    <li class="nav-item me-2"><a class="nav-link elem-menu p-2" href="contacto.html"
                            accesskey="c">Contacto</a>
                    </li>
                    <li class="nav-item me-2"><a class="nav-link elem-menu p-2" href="registro.html"
                            accesskey="g">Registro</a>
                    </li>
                </ul>
            </div>
            <a href="./index-en.html" lang="es" title="Cambiar a Inglés" class="language nav-item">
                English (EN)
            </a>
        </nav>

    </header>
    <main>
        <section id="Registro" class="registro">
            <h2>Registration</h2>
            <form id="registro-form-id" class="registro-form" aria-label="Registration form" method="post"
                action="/submit-register">
                <div class="mb-3">
                    <fieldset class="registro-fs">
                        <input type="hidden" name="idioma" value="english">
                        <legend>Registration Details</legend>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Name:
                            </label>
                            <input type="text" id="nombre" name="nombre" class="form-control"
                                placeholder="Ex: Eustaquio Ramirez">
                            <span id="nombre-error" class="error" aria-live="polite"></span>
                        </div>
                        <div class="mb-3">
                            <label for="contraseña" class="form-label">Password:
                            </label>
                            <input type="text" id="contraseña" name="constraseña" class="form-control"
                                placeholder="Ex: ASDFg7&A">
                            <span id="contraseña-error" class="error" aria-live="polite"></span>
                        </div>

                        <button type="submit" class="btn btn-success" aria-label="Submit form">Submit</button>
                        <button type="reset" class="btn btn-secondary" aria-label="Clear form">Clear</button>
                    </fieldset>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; COPYRIGHT 2025 Zephyra</p>
    </footer>
    <script src="./script/formulario-registro.js" type="text/javascript"></script>
    <script src="./script/bootstrap.bundle.min.js" type="text/javascript"></script>
</body>

</html>
