<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Contact Form</title>

    <link rel="stylesheet" href="./styles/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand div-logo" href="./index-en.html">
                <img src="./images/icono-logo.png" alt="Logo Zephyra" title="Zephyra logo" width="100">
                <h1 class="zephyra">ZEPHYRA</h1>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link elem-menu" href="index-en.html" accesskey="h">Home</a></li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="vehicles-en.html" accesskey="v">Vehicles</a></li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="bookings-en.html" accesskey="b">Bookings</a></li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="contact-en.html" accesskey="c">Contact</a></li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="register-en.html" accesskey="g">Register</a></li>
                </ul>
            </div>
            <a href="./index.html" lang="es" title="Change to Spanish">
            Español (ES)
            </a>
        </nav>
    </header>
    <main>
        <form>
            <h2>Contacto</h2>

            <fieldset>
                <legend>Datos de contacto</legend>

                <label for="nombre">Name</label>
                <input type="text" id="nombre"><br><br>
                <label for="email">Email</label>
                <input type="text" id="email"><br><br>
                <label for="mensaje">Message</label>
                <input type="text" id="mensaje"><br><br>
                <button type="submit">Send</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; COPYRIGHT 2025 Zephyra</p>
    </footer>
    <script src="./script/bootstrap.bundle.min.js" type="text/javascript"></script>
</body>

</html>
