<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto sencillo</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <header>
        <a href="../html-en/contact-en.html" lang="es" title="Change to English">
            English (EN)
        </a>
        <div class="div-logo">
            <img src="../images/icono-logo.png" alt="Logo Zephyra" title="Logo Zephyra" width="150">
            <h1 class="zephyra">ZEPHYRA</h1>
        </div>
        <nav class="barra-menu">
            <a class="elem-menu" href="index.html" accesskey="i">Inicio</a>
            <a class="elem-menu" href="vehiculos.html" accesskey="v">Vehículos</a>
            <a class="elem-menu" href="reservas.html" accesskey="r">Reservas</a>
            <a class="elem-menu" href="contacto.html" accesskey="c">Contacto</a>
        </nav>
    </header>
    <main>
        <form>
            <h2>Contacto</h2>
            <fieldset>
                <legend>Datos de contacto</legend>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre"><br><br>
                <label for="email">Email</label>
                <input type="text" id="email"><br><br>
                <label for="mensaje">Mensaje</label>
                <input type="text" id="mensaje"><br><br>
                <button type="submit">Enviar</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy;COPYRIGHT 2025 Zephyra</p>
    </footer>
</body>

</html>
