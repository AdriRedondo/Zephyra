<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Reservations</title>

    <link rel="stylesheet" href="./styles/bootstrap.min.css">

    <script src="./script/formulario.js" type="text/javascript"></script>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/form-reservas.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand div-logo" href="./index-en.html">
                <img src="./images/icono-logo.png" alt="Logo Zephyra" title="Zephyra logo" width="100">
                <h1 class="zephyra">ZEPHYRA</h1>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link elem-menu" href="index-en.html" accesskey="h">Home</a></li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="vehicles-en.html"
                            accesskey="v">Vehicles</a></li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="bookings-en.html"
                            accesskey="b">Bookings</a></li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="contact-en.html" accesskey="c">Contact</a>
                    </li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="register-en.html"
                            accesskey="g">Register</a></li>
                </ul>
            </div>
            <a href="./reservas.html" lang="es" title="Change to Spanish">
                Español (ES)
            </a>
        </nav>
    </header>
    <main>
        <section id="Reservas" class="reservas">
            <h2>Bookings</h2>
            <form id="reservas-form-id" class="reservas-form" aria-label="Booking form" method="post"
                action="/submit-bookings">
                <div class="mb-3">
                    <fieldset class="bookings-fs">
                        <input type="hidden" name="idioma" value="english">
                        <legend>Booking Details</legend>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Name:
                            </label>
                            <input type="text" id="nombre" name="nombre" class="form-control"
                                placeholder="Ej: Eustaquio Ramirez">
                            <span id="nombre-error" class="error" aria-live="polite"></span>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Email
                                address: </label>
                            <input type="email" id="correo" name="correo" class="form-control"
                                placeholder="Ej: eusta03@ucm.es">
                            <span id="correo-error" class="error" aria-live="polite"></span>
                        </div>

                        <div class="mb-3">
                            <label for="vehiculos-form" class="form-label">Vehicles: </label>
                            <select id="vehiculos-form" name="vehiculos_form" class="form-control">
                                <option value="">---</option>
                                <option value="coche">Car</option>
                                <option value="moto">Motorcycle</option>
                                <option value="patinete">Scooter</option>
                                <option value="furgoneta">Van</option>
                            </select>
                            <span id="vehículo-error" class="error"></span>
                        </div>

                        <div class="mb-3">
                            <label for="inicio" class="form-label">Start:
                            </label>
                            <input type="datetime-local" id="inicio" name="inicio" class="form-control">
                            <span id="inicio-error" class="error" aria-live="polite"></span>
                        </div>
                        <div class="mb-3">
                            <label for="horas" class="form-label">Booking hours: </label>
                            <input type="number" id="horas" name="horas" class="form-control" placeholder="Ej: 24">
                            <span id="horas-error" class="error" aria-live="polite"></span>
                        </div>
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Phone: </label>
                            <input type="tel" id="telefono" name="telefono" class="form-control"
                                placeholder="Ej: 123456789">
                            <span id="telefono-error" class="error" aria-live="polite"></span>
                        </div>
                        <div class="mb-3">
                            <label for="terminos">Accept terms and
                                conditions</label>
                            <input type="checkbox" id="terminos" name="terminos" class="form-check-input" required>
                        </div>
                        <div class="progress mb-3" role="progressbar" aria-label="Form progress bar"
                            aria-valuenow="16.7" aria-valuemin="0" aria-valuemax="100">
                            <div class="progress-bar"></div>
                        </div>

                        <button type="submit" class="btn btn-success" aria-label="Submit form">Submit</button>
                        <button type="reset" class="btn btn-secondary" aria-label="Clear form">Clear</button>
                    </fieldset>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; COPYRIGHT 2025 Zephyra</p>
    </footer>
    <script src="./script/formulario-reservas.js" type="text/javascript"></script>
    <script src="./script/bootstrap.bundle.min.js" type="text/javascript"></script>
</body>

</html>
