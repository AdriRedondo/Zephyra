<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas de coches</title>

    <link rel="stylesheet" href="./styles/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/form-reservas.css">


</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand div-logo" href="./index.html">
                <img src="./images/icono-logo.png" alt="Logo Zephyra" title="Logo Zephyra" width="100">
                <h1 class="zephyra">ZEPHYRA</h1>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link elem-menu" href="index.html" accesskey="i">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="vehiculos.html" accesskey="v">Vehículos</a>
                    </li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="reservas.html" accesskey="r">Reservas</a>
                    </li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="contacto.html" accesskey="c">Contacto</a>
                    </li>
                    <li class="nav-item"><a class="nav-link elem-menu" href="registro.html" accesskey="g">Registro</a>
                    </li>
                </ul>
            </div>
            <a href="./bookings-en.html" lang="es" title="Cambiar a Inglés" class="language">
                English (EN)
            </a>
        </nav>
    </header>
    <main>
        <section id="Reservas" class="reservas">
            <h2>Reservas</h2>
            <form id="reservas-form-id" class="reservas-form" aria-label="Formulario de reserva" method="post"
                action="/submit-bookings">
                <div class="mb-3">
                    <fieldset class="bookings-fs">
                        <input type="hidden" name="idioma" value="español">
                        <legend>Datos reserva</legend>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre:
                            </label>
                            <input type="text" id="nombre" name="nombre" class="form-control"
                                placeholder="Ej: Eustaquio Ramirez">
                            <span id="nombre-error" class="error" aria-live="polite"></span>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo
                                electrónico: </label>
                            <input type="email" id="correo" name="correo" class="form-control"
                                placeholder="Ej: eusta03@ucm.es">
                            <span id="correo-error" class="error" aria-live="polite"></span>
                        </div>

                        <div class="mb-3">
                            <label for="vehiculos-form" class="form-label">Vehículos: </label>
                            <select id="vehiculos-form" name="vehiculos_form" class="form-control">
                                <option value="">---</option>
                                <option value="coche">Coche</option>
                                <option value="moto">Moto</option>
                                <option value="patinete">Patinete</option>
                                <option value="furgoneta">Furgoneta</option>
                            </select>
                            <span id="vehículo-error" class="error"></span>
                        </div>

                        <div class="mb-3">
                            <label for="inicio" class="form-label">Inicio:
                            </label>
                            <input type="datetime-local" id="inicio" name="inicio" class="form-control">
                            <span id="inicio-error" class="error" aria-live="polite"></span>
                        </div>
                        <div class="mb-3">
                            <label for="horas" class="form-label">Horas de reserva: </label>
                            <input type="number" id="horas" name="horas" class="form-control" placeholder="Ej: 24">
                            <span id="horas-error" class="error" aria-live="polite"></span>
                        </div>
                        <!-- 
                        <div class="mb-3">
                            <label for="fin" class="form-label">Fin:
                            </label>
                            <input type="datetime-local" id="fin" class="form-control">
                            <span id="fin-error" class="error"></span>
                        </div> 
                        -->

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono: </label>
                            <input type="tel" id="telefono" name="telefono" class="form-control"
                                placeholder="Ej: 123456789">
                            <span id="telefono-error" class="error" aria-live="polite"></span>
                        </div>
                        <div class="mb-3">
                            <label for="terminos">Acepta términos y
                                condiciones</label>
                            <input type="checkbox" id="terminos" name="terminos" class="form-check-input" required>
                        </div>
                        <div class="progress mb-3" role="progressbar" aria-label="Barra de progreso del formulario"
                            aria-valuenow="16.7" aria-valuemin="0" aria-valuemax="100">
                            <div class="progress-bar"></div>
                        </div>

                        <button type="submit" class="btn btn-success" aria-label="Enviar formulario">Enviar</button>
                        <button type="reset" class="btn btn-secondary" aria-label="Limpiar formulario">Limpiar</button>
                    </fieldset>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy;COPYRIGHT 2025 Zephyra</p>
    </footer>
    <script src="./script/formulario-reservas.js" type="text/javascript"></script>
    <script src="./script/bootstrap.bundle.min.js" type="text/javascript"></script>

</body>

</html>
