<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas de coches</title>

    <script src="../js/formulario.js" type="text/javascript"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/form-reservas.css">
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">

</head>

<body>
    <header>
        <a href="../html-en/bookings-en.html" lang="es" title="Cambiar a Inglés">
            English (EN)
        </a>
        <div class="div-logo">
            <img src="../images/icono-logo.png" alt="Logo Zephyra" title="Logo Zephyra" width="150">
            <h1 class="zephyra">ZEPHYRA</h1>
        </div>
        <nav class="barra-menu">
            <a class="elem-menu" href="index.html" accesskey="i">Inicio</a>
            <a class="elem-menu" href="vehiculos.html" accesskey="v">Vehículos</a>
            <a class="elem-menu" href="reservas.html" accesskey="r">Reservas</a>
            <a class="elem-menu" href="contacto.html" accesskey="c">Contacto</a>
        </nav>
    </header>
    <main>
        <section id="Reservas" class="reservas">
            <h2>Reservas</h2>
            <form id="reservas-form-id" class="reservas-form" aria-label="Formulario de reserva">
                <div class="mb-3">
                    <fieldset class="bookings-fs">
                        <legend>Datos reserva</legend>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre: </label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico: </label>
                            <input type="email" id="correo" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="vehiculos-form" class="form-label">Vehículos: </label>
                            <select id="vehiculos-form" class="form-control" required>
                                <option value="tesla">Tesla</option>
                                <option value="toyota">Toyota</option>
                                <option value="audi">Audi</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="inicio" class="form-label">Inicio: </label>
                            <input type="datetime-local" id="inicio" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="fin" class="form-label">Fin: </label>
                            <input type="datetime-local" id="fin" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono: </label>
                            <input type="tel" id="telefono" class="form-control" pattern="[0-9]{9}">
                        </div>
                        <div class="mb-3">
                            <label for="terminos">Acepta términos y
                                condiciones</label>
                            <input type="checkbox" id="terminos" class="form-check-input" required>
                        </div>

                        <button type="submit" class="btn btn-success" aria-label="Enviar formulario">Enviar</button>
                        <button type="reset" class="btn btn-secondary" aria-label="Limpiar formulario">Limpiar</button>
                    </fieldset>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy;COPYRIGHT 2025 Zephyra</p>
    </footer>
</body>

</html>
