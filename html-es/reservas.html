<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas de coches</title>

    <script src="../js/formulario.js" type="text/javascript"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <a href="../html-en/bookings-en.html" lang="es" title="Cambiar a Inglés">
            English (EN)
        </a>
        <div class="div-logo">
            <img src="../images/icono-logo.png" alt="Logo Zephyra" title="Logo Zephyra" width="150">
            <h1 class="zephyra">ZEPHYRA</h1>
        </div>
        <nav class="barra-menu">
            <a class="elem-menu" href="index.html" accesskey="i">Inicio</a>
            <a class="elem-menu" href="vehiculos.html" accesskey="v">Vehículos</a>
            <a class="elem-menu" href="reservas.html" accesskey="r">Reservas</a>
            <a class="elem-menu" href="contacto.html" accesskey="c">Contacto</a>
        </nav>
    </header>
    <main>
        <section id="Reservas">
            <h2>Reservas</h2>
            <form id="reservas-form" aria-label="Formulario de reserva">
                <fieldset>
                    <legend>Datos reserva</legend>
                    <label for="nombre">Nombre: </label>
                    <input type="text" id="nombre" required><br><br>

                    <label for="correo">Correo electrónico: </label>
                    <input type="email" id="correo" required><br><br>

                    <label for="vehiculos-form">Vehículos: </label>
                    <select id="vehiculos-form" required>
                        <option value="tesla">Tesla</option>
                        <option value="toyota">Toyota</option>
                        <option value="audi">Audi</option>
                    </select>
                    <br><br>

                    <label for="inicio">Inicio: </label>
                    <input type="datetime-local" id="inicio" required><br><br>

                    <label for="fin">Fin: </label>
                    <input type="datetime-local" id="fin" required><br><br>

                    <label for="telefono">Teléfono: </label>
                    <input type="tel" id="telefono" pattern="[0-9]{9}"><br><br>

                    <label for="terminos">Acepta términos y
                        condiciones</label>
                    <input type="checkbox" id="terminos" required><br><br>

                    <button type="submit" aria-label="Enviar formulario">Enviar</button>
                    <button type="reset" aria-label="Limpiar formulario">Limpiar</button>
                </fieldset>

            </form>
        </section>
    </main>
    <footer>
        <p>&copy;COPYRIGHT 2025 Zephyra</p>
    </footer>
</body>

</html>
